name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[dl,dev]"
      - name: Test
        run: pytest -q
      - name: CLI smoke (downloads the published weights)
        run: |
          resenh --version
          python -c "import numpy as np; from PIL import Image; Image.fromarray((np.random.default_rng(0).random((96,128,3))*40).astype('uint8')).save('dark.png')"
          resenh enhance dark.png -o out.png --mode hybrid --device cpu
          python -c "from PIL import Image; assert Image.open('out.png').size == (128, 96); print('cli ok')"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
