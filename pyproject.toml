[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "resenh"
version = "0.1.2"
description = "Robust low-light image restoration and enhancement: classical, deep and adaptive hybrid pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sharadh Naidu", email = "sharadhanaidu@rvu.edu.in" }]
keywords = ["low-light", "image-enhancement", "retinex", "computer-vision", "image-restoration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pillow>=10.0",
]

[project.optional-dependencies]
dl = ["torch>=2.2", "einops>=0.7", "huggingface_hub>=0.23"]
full = ["resenh[dl]", "transformers>=4.44", "timm>=1.0"]
eval = ["resenh[dl]", "lpips>=0.1.4", "pyiqa>=0.1.13", "scipy>=1.11"]
app = ["resenh[dl]", "gradio>=5.0"]
train = ["resenh[eval]", "pyyaml>=6.0", "imagehash>=4.3", "tqdm>=4.66"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
resenh = "resenh.cli:main"

[project.urls]
Homepage = "https://resenh.sharadh.blog"
Source = "https://github.com/SharadhNaidu/resen"
Issues = "https://github.com/SharadhNaidu/resen/issues"
Weights = "https://huggingface.co/SharadhNaiduTrains/resenh"

[tool.hatch.build.targets.wheel]
packages = ["src/resenh"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.sdist]
include = ["src/resenh", "tests", "README.md", "LICENSE", "pyproject.toml"]
