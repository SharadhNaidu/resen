<svg style="background:#fff" viewBox="0 0 816 304" role="img" aria-labelledby="arch-title arch-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="arch-title">resenh system architecture</title>
  <desc id="arch-desc">A photo is measured by the analyzer, restored by a classical branch and a network branch in parallel, and the quality controller fuses the two into the result.</desc>
  <rect width="100%" height="100%" rx="12" fill="#FFFFFF"/><defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5D6380"/></marker>
    <marker id="ahp" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6A88E2"/></marker>
  </defs>
  <path d="M120 164 H152" stroke="#5D6380" stroke-width="1" fill="none" marker-end="url(#ah)"/><path d="M272 152 H280 Q288 152 288 144 V88 Q288 80 296 80 H328" stroke="#5D6380" stroke-width="1" fill="none" marker-end="url(#ah)"/><path d="M272 176 H296 Q304 176 304 184 V240 Q304 248 312 248 H328" stroke="#5D6380" stroke-width="1" fill="none" marker-end="url(#ah)"/><path d="M488 80 H504 Q512 80 512 88 V144 Q512 152 520 152 H536" stroke="#5D6380" stroke-width="1" fill="none" marker-end="url(#ah)"/><path d="M488 248 H504 Q512 248 512 240 V184 Q512 176 520 176 H536" stroke="#5D6380" stroke-width="1" fill="none" marker-end="url(#ah)"/><path d="M664 164 H696" stroke="#5D6380" stroke-width="1" fill="none" marker-end="url(#ah)"/><path d="M408 112 V216" stroke="#6A88E2" stroke-width="1" stroke-dasharray="4,3" fill="none" marker-end="url(#ahp)"/>
  <text x="420" y="160" font-family="'Google Sans Code',ui-monospace,monospace" font-size="8" letter-spacing=".06em" fill="#6A88E2">PRIORS</text><text x="420" y="172" font-family="'Google Sans Code',ui-monospace,monospace" font-size="8" letter-spacing=".06em" fill="#6A88E2">(FINE-TUNED)</text>
  
  <rect x="24" y="136" width="96" height="56" rx="8" fill="#EEF2FF" stroke="#6A88E2" stroke-width="1"/>
  <text x="36" y="154" font-family="'Google Sans Code',ui-monospace,monospace" font-size="8" letter-spacing=".08em" fill="#6A88E2">INPUT</text>
  <text x="72.0" y="170.0" text-anchor="middle" font-family="'Google Sans Flex','Google Sans',system-ui,sans-serif" font-size="13" font-weight="600" fill="#1E2033">Photo</text>
  <text x="72.0" y="186.0" text-anchor="middle" font-family="'Google Sans Code',ui-monospace,monospace" font-size="9" fill="#5D6380">any size</text>
  <rect x="152" y="136" width="120" height="56" rx="8" fill="#FFFFFF" stroke="#1E2033" stroke-width="1"/>
  <text x="164" y="154" font-family="'Google Sans Code',ui-monospace,monospace" font-size="8" letter-spacing=".08em" fill="#1E2033">MEASURE</text>
  <text x="212.0" y="170.0" text-anchor="middle" font-family="'Google Sans Flex','Google Sans',system-ui,sans-serif" font-size="13" font-weight="600" fill="#1E2033">Analyzer</text>
  <text x="212.0" y="186.0" text-anchor="middle" font-family="'Google Sans Code',ui-monospace,monospace" font-size="9" fill="#5D6380">stats → params</text>
  <rect x="328" y="48" width="160" height="64" rx="8" fill="#FFFFFF" stroke="#1E2033" stroke-width="1"/>
  <text x="340" y="66" font-family="'Google Sans Code',ui-monospace,monospace" font-size="8" letter-spacing=".08em" fill="#1E2033">CLASSICAL</text>
  <text x="408.0" y="86.0" text-anchor="middle" font-family="'Google Sans Flex','Google Sans',system-ui,sans-serif" font-size="13" font-weight="600" fill="#1E2033">Classical branch</text>
  <text x="408.0" y="102.0" text-anchor="middle" font-family="'Google Sans Code',ui-monospace,monospace" font-size="9" fill="#5D6380">Retinex · CLAHE · denoise</text>
  <rect x="328" y="216" width="160" height="64" rx="8" fill="#FFFFFF" stroke="#1E2033" stroke-width="1"/>
  <text x="340" y="234" font-family="'Google Sans Code',ui-monospace,monospace" font-size="8" letter-spacing=".08em" fill="#1E2033">DEEP</text>
  <text x="408.0" y="254.0" text-anchor="middle" font-family="'Google Sans Flex','Google Sans',system-ui,sans-serif" font-size="13" font-weight="600" fill="#1E2033">Network branch</text>
  <text x="408.0" y="270.0" text-anchor="middle" font-family="'Google Sans Code',ui-monospace,monospace" font-size="9" fill="#5D6380">Retinexformer, 1.6 M</text>
  <rect x="536" y="132" width="128" height="64" rx="8" fill="#FFF1E4" stroke="#F7862A" stroke-width="1"/>
  <text x="548" y="150" font-family="'Google Sans Code',ui-monospace,monospace" font-size="8" letter-spacing=".08em" fill="#F7862A">HYBRID</text>
  <text x="600.0" y="170.0" text-anchor="middle" font-family="'Google Sans Flex','Google Sans',system-ui,sans-serif" font-size="13" font-weight="600" fill="#1E2033">Quality controller</text>
  <text x="600.0" y="186.0" text-anchor="middle" font-family="'Google Sans Code',ui-monospace,monospace" font-size="9" fill="#5D6380">guards → fusion</text>
  <rect x="696" y="136" width="96" height="56" rx="8" fill="#EEF2FF" stroke="#6A88E2" stroke-width="1"/>
  <text x="708" y="154" font-family="'Google Sans Code',ui-monospace,monospace" font-size="8" letter-spacing=".08em" fill="#6A88E2">OUTPUT</text>
  <text x="744.0" y="170.0" text-anchor="middle" font-family="'Google Sans Flex','Google Sans',system-ui,sans-serif" font-size="13" font-weight="600" fill="#1E2033">Result</text>
  <text x="744.0" y="186.0" text-anchor="middle" font-family="'Google Sans Code',ui-monospace,monospace" font-size="9" fill="#5D6380">lamps protected</text>
</svg>